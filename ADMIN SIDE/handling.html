<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Handling — Tourify Admin</title>
  <link href="../CLIENT SIDE/assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="../CLIENT SIDE/assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/css/admin.css" rel="stylesheet">
</head>
<body>
  <div class="admin-wrapper">
    <aside class="admin-sidebar"><div class="sidebar-brand"><a href="index.html" class="brand-logo"><i class="bi bi-compass-fill"></i><span class="sitename">Tourify</span></a><span class="brand-badge">Admin</span></div><div class="sidebar-content"><div class="nav-section-title">Portal</div><ul class="admin-nav"><li><a href="index.html" class="nav-link"><i class="bi bi-speedometer2"></i> Dashboard</a></li><li><a href="handling.html" class="nav-link active"><i class="bi bi-kanban"></i> Handling</a></li></ul></div><div class="sidebar-footer"><a href="../CLIENT SIDE/index.html" target="_blank" class="live-site-btn"><i class="bi bi-box-arrow-up-right"></i> Live Site</a><a href="#" class="nav-link btn-admin-logout text-danger"><i class="bi bi-box-arrow-right"></i> Log Out</a></div></aside>
    <div class="admin-main"><header class="admin-topbar"><div class="topbar-left"><button id="sidebarToggleBtn" class="sidebar-toggle-btn d-lg-none" aria-label="Toggle Sidebar"><i class="bi bi-list"></i></button><div class="page-breadcrumb"><h1 class="page-title">Handling</h1><p class="breadcrumb-sub">Manage shared Tourify records</p></div></div><div class="topbar-right"><span id="topbarAdminName" class="admin-name">Administrator</span><span id="topbarAdminRole" class="admin-role ms-2">Super Admin</span></div></header>
      <main class="admin-body"><div id="handlingNotice" class="alert d-none"></div>
        <ul class="nav nav-tabs mb-4" id="handlingTabs"><li class="nav-item"><button class="nav-link active" data-tab="tours">Tours</button></li><li class="nav-item"><button class="nav-link" data-tab="destinations">Destinations</button></li><li class="nav-item"><button class="nav-link" data-tab="bookings">Bookings</button></li><li class="nav-item"><button class="nav-link" data-tab="users">Users</button></li><li class="nav-item"><button class="nav-link" data-tab="messages">Messages</button></li></ul>
        <section class="handling-section" data-section="tours"><div class="admin-card mb-4"><div class="admin-card-header"><h5 class="admin-card-title">Tour editor</h5></div><div class="admin-card-body"><form id="handlingTourForm" class="row g-3"><input type="hidden" id="handlingTourId"><div class="col-md-6"><label class="form-label">Title</label><input id="handlingTourTitle" class="form-control" required></div><div class="col-md-3"><label class="form-label">Category</label><input id="handlingTourCategory" class="form-control" required></div><div class="col-md-3"><label class="form-label">Status</label><select id="handlingTourStatus" class="form-select"><option>Active</option><option>Inactive</option></select></div><div class="col-md-4"><label class="form-label">Destination</label><input id="handlingTourDestination" class="form-control" required></div><div class="col-md-3"><label class="form-label">Duration</label><input id="handlingTourDuration" class="form-control" placeholder="7 Days" required></div><div class="col-md-2"><label class="form-label">Price (₹)</label><input id="handlingTourPrice" type="number" min="0" class="form-control" required></div><div class="col-md-3"><label class="form-label">Max Group</label><input id="handlingTourGroup" type="number" min="1" class="form-control"></div><div class="col-md-6"><label class="form-label">Image path</label><input id="handlingTourImage" class="form-control"></div><div class="col-md-6"><label class="form-label">Description</label><textarea id="handlingTourDescription" class="form-control"></textarea></div><div class="col-12"><button class="btn btn-primary" type="submit">Save Tour</button> <button class="btn btn-outline-secondary" type="button" id="handlingTourClear">Clear</button></div></form></div></div><div class="admin-card"><div class="admin-card-header"><h5 class="admin-card-title">Tours</h5></div><div class="table-responsive"><table class="admin-table"><tbody id="handlingToursTable"></tbody></table></div></div></section>
        <section class="handling-section d-none" data-section="destinations"><div class="admin-card mb-4"><div class="admin-card-header"><h5 class="admin-card-title">Destination editor</h5></div><div class="admin-card-body"><form id="handlingDestinationForm" class="row g-3"><input type="hidden" id="handlingDestinationId"><div class="col-md-5"><label class="form-label">Name</label><input id="handlingDestinationName" class="form-control" required></div><div class="col-md-3"><label class="form-label">Country</label><input id="handlingDestinationCountry" class="form-control" required></div><div class="col-md-2"><label class="form-label">Continent</label><input id="handlingDestinationContinent" class="form-control"></div><div class="col-md-2"><label class="form-label">Rating</label><input id="handlingDestinationRating" type="number" min="0" max="5" step="0.1" class="form-control"></div><div class="col-md-6"><label class="form-label">Image path</label><input id="handlingDestinationImage" class="form-control"></div><div class="col-md-6"><label class="form-label">Description</label><textarea id="handlingDestinationDescription" class="form-control"></textarea></div><div class="col-12"><button class="btn btn-primary" type="submit">Save Destination</button> <button class="btn btn-outline-secondary" type="button" id="handlingDestinationClear">Clear</button></div></form></div></div><div class="admin-card"><div class="admin-card-header"><h5 class="admin-card-title">Destinations</h5></div><div class="table-responsive"><table class="admin-table"><tbody id="handlingDestinationsTable"></tbody></table></div></div></section>
        <section class="handling-section d-none" data-section="bookings"><div class="admin-card"><div class="admin-card-header"><h5 class="admin-card-title">Bookings</h5></div><div class="table-responsive"><table class="admin-table"><tbody id="handlingBookingsTable"></tbody></table></div></div></section>
        <section class="handling-section d-none" data-section="users"><div class="admin-card mb-4"><div class="admin-card-header"><h5 class="admin-card-title">User editor</h5></div><div class="admin-card-body"><form id="handlingUserForm" class="row g-3"><input type="hidden" id="handlingUserId"><div class="col-md-4"><label class="form-label">Name</label><input id="handlingUserName" class="form-control" required></div><div class="col-md-4"><label class="form-label">Email</label><input id="handlingUserEmail" type="email" class="form-control" required></div><div class="col-md-2"><label class="form-label">Role</label><select id="handlingUserRole" class="form-select"><option>Customer</option><option>Staff</option><option>Admin</option></select></div><div class="col-md-2"><label class="form-label">New password</label><input id="handlingUserPassword" type="password" minlength="6" class="form-control" autocomplete="new-password"></div><div class="col-12"><button class="btn btn-primary" type="submit">Save User</button> <button class="btn btn-outline-secondary" type="button" id="handlingUserClear">Clear</button></div></form><div id="handlingUserBookings" class="mt-4"></div></div></div><div class="admin-card"><div class="admin-card-header"><h5 class="admin-card-title">Users</h5></div><div class="table-responsive"><table class="admin-table"><tbody id="handlingUsersTable"></tbody></table></div></div></section>
        <section class="handling-section d-none" data-section="messages"><div class="admin-card"><div class="admin-card-header"><h5 class="admin-card-title">Messages</h5></div><div class="table-responsive"><table class="admin-table"><tbody id="handlingMessagesTable"></tbody></table></div></div></section>
      </main>
    </div>
  </div>
  <script src="../CLIENT SIDE/assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script><script src="assets/js/store.js"></script><script src="assets/js/auth.js"></script><script src="assets/js/admin.js"></script><script src="assets/js/handling.js"></script>
</body>
</html>
