<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Admin Login — Tourify Portal</title>

  <!-- Google Fonts matching Tourify Site -->
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Poppins:wght@300;400;500;600;700&family=Raleway:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Vendor CSS Files -->
  <link href="../CLIENT SIDE/assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="../CLIENT SIDE/assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">

  <!-- Admin Custom CSS -->
  <link href="assets/css/admin.css" rel="stylesheet">
</head>

<body class="admin-login-body">

  <div class="login-card">
    <div class="login-card-header">
      <div class="d-inline-flex align-items-center justify-content-center bg-white rounded-circle mb-3 shadow-sm" style="width: 58px; height: 58px;">
        <i class="bi bi-compass-fill fs-2" style="color: var(--accent-color);"></i>
      </div>
      <h2 class="sitename">TOURIFY ADMIN</h2>
      <p>Secure Portal for Travel & Tourism Management</p>
    </div>

    <div class="login-card-body">
      <!-- Feedback Alert -->
      <div id="loginAlert" class="alert alert-danger d-none py-2 px-3 small" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-1"></i> <span id="loginAlertText"></span>
      </div>

      <!-- Login Form -->
      <form id="adminLoginForm" novalidate>
        <div class="mb-3">
          <label for="adminEmail" class="form-label fw-semibold small text-secondary">Username or Email</label>
          <div class="input-group">
            <span class="input-group-text bg-light text-secondary border-end-0"><i class="bi bi-person"></i></span>
            <input type="text" class="form-control border-start-0 ps-1" id="adminEmail" placeholder="Enter admin email" required autocomplete="username">
          </div>
        </div>

        <div class="mb-4">
          <label for="adminPassword" class="form-label fw-semibold small text-secondary">Password</label>
          <div class="input-group">
            <span class="input-group-text bg-light text-secondary border-end-0"><i class="bi bi-key"></i></span>
            <input type="password" class="form-control border-start-0 ps-1" id="adminPassword" placeholder="••••••••" required autocomplete="current-password">
            <button class="btn btn-outline-secondary border-start-0" type="button" id="togglePasswordBtn">
              <i class="bi bi-eye" id="togglePasswordIcon"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm d-flex align-items-center justify-content-center gap-2">
          <i class="bi bi-box-arrow-in-right"></i> Sign In to Dashboard
        </button>
      </form>

      <div class="mt-4 pt-3 border-top text-center">
        <a href="../CLIENT SIDE/index.html" class="text-decoration-none small text-muted hover-underline">
          <i class="bi bi-arrow-left"></i> Return to Main Website
        </a>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="../CLIENT SIDE/assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      // If already logged in, redirect straight to dashboard
      if (window.Auth && window.Auth.isLoggedIn()) {
        window.location.href = 'index.html';
        return;
      }

      const form = document.getElementById('adminLoginForm');
      const emailInput = document.getElementById('adminEmail');
      const passwordInput = document.getElementById('adminPassword');
      const alertBox = document.getElementById('loginAlert');
      const alertText = document.getElementById('loginAlertText');
      const togglePasswordBtn = document.getElementById('togglePasswordBtn');
      const togglePasswordIcon = document.getElementById('togglePasswordIcon');

      // Password visibility toggle
      if (togglePasswordBtn) {
        togglePasswordBtn.addEventListener('click', function () {
          const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
          passwordInput.setAttribute('type', type);
          togglePasswordIcon.classList.toggle('bi-eye');
          togglePasswordIcon.classList.toggle('bi-eye-slash');
        });
      }

      // Submit handler
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        alertBox.classList.add('d-none');

        const identity = emailInput.value.trim();
        const password = passwordInput.value.trim();

        if (!identity || !password) {
          alertText.textContent = 'Please fill in both username/email and password.';
          alertBox.classList.remove('d-none');
          return;
        }

        const res = window.Auth.login(identity, password);
        if (res.success) {
          window.location.href = 'index.html';
        } else {
          alertText.textContent = res.message || 'Invalid login credentials.';
          alertBox.classList.remove('d-none');
        }
      });
    });
  </script>
</body>
</html>
